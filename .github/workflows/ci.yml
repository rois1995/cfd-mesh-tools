name: Contract Tests

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cgns,dev]"
      - name: Run API & numerical contract tests
        env:
          NUMBA_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python tests/test_contract.py
